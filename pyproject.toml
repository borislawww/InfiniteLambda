[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pwc2dbt"
version = "0.1.0"
description = "Convert Informatica PowerCenter mapping XML into dbt models (DuckDB dialect)"
requires-python = ">=3.11"
dependencies = ["lxml>=5"]

[project.optional-dependencies]
dev = ["pytest>=8", "duckdb>=1.1"]

[project.scripts]
pwc2dbt = "pwc2dbt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
