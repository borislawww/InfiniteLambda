version: 2

models:
  - name: "customers"
    description: "Target CUSTOMERS loaded by PowerCenter mapping m_FL_JS_MARTS_CORE."
    columns:
      - name: "customer_id"
        data_type: "varchar"
      - name: "customer_name"
        data_type: "varchar"
      - name: "lifetime_orders"
        data_type: "double"
      - name: "first_order_date"
        data_type: "timestamp"
      - name: "last_order_date"
        data_type: "timestamp"
      - name: "lifetime_spend"
        data_type: "decimal(12,2)"
      - name: "lifetime_spend_pretax"
        data_type: "decimal(12,2)"
      - name: "lifetime_tax_paid"
        data_type: "decimal(12,2)"
      - name: "customer_type"
        data_type: "varchar"
  - name: "order_items"
    description: "Target ORDER_ITEMS loaded by PowerCenter mapping m_FL_JS_MARTS_CORE."
    columns:
      - name: "order_item_id"
        data_type: "varchar"
      - name: "order_id"
        data_type: "varchar"
      - name: "product_id"
        data_type: "varchar"
      - name: "ordered_at_day"
        data_type: "timestamp"
      - name: "product_name"
        data_type: "varchar"
      - name: "product_type"
        data_type: "varchar"
      - name: "product_price"
        data_type: "decimal(12,2)"
      - name: "is_food_item"
        data_type: "decimal(1,0)"
      - name: "is_drink_item"
        data_type: "decimal(1,0)"
      - name: "supply_cost_per_product"
        data_type: "decimal(12,2)"
      - name: "has_perishable_supply"
        data_type: "decimal(1,0)"
  - name: "products"
    description: "Target PRODUCTS loaded by PowerCenter mapping m_FL_JS_MARTS_CORE."
    columns:
      - name: "product_id"
        data_type: "varchar"
      - name: "product_name"
        data_type: "varchar"
      - name: "product_type"
        data_type: "varchar"
      - name: "product_price_cents"
        data_type: "double"
      - name: "product_price"
        data_type: "decimal(12,2)"
      - name: "product_description"
        data_type: "varchar"
      - name: "is_food_item"
        data_type: "decimal(1,0)"
      - name: "is_drink_item"
        data_type: "decimal(1,0)"
  - name: "supplies"
    description: "Target SUPPLIES loaded by PowerCenter mapping m_FL_JS_MARTS_CORE."
    columns:
      - name: "supply_id"
        data_type: "varchar"
      - name: "supply_name"
        data_type: "varchar"
      - name: "supply_cost_cents"
        data_type: "decimal(12,2)"
      - name: "supply_cost"
        data_type: "decimal(12,2)"
      - name: "is_perishable"
        data_type: "decimal(1,0)"
      - name: "product_id"
        data_type: "varchar"
