version: 2

models:
  - name: "stg_customers"
    description: "Target STG_CUSTOMERS loaded by PowerCenter mapping m_FL_JS_STAGING_FULL."
    columns:
      - name: "customer_id"
        data_type: "varchar"
      - name: "customer_name"
        data_type: "varchar"
  - name: "stg_locations"
    description: "Target STG_LOCATIONS loaded by PowerCenter mapping m_FL_JS_STAGING_FULL."
    columns:
      - name: "location_id"
        data_type: "varchar"
      - name: "location_name"
        data_type: "varchar"
      - name: "opened_date"
        data_type: "timestamp"
      - name: "tax_rate"
        data_type: "decimal(6,4)"
      - name: "region"
        data_type: "varchar"
  - name: "stg_orders"
    description: "Target STG_ORDERS loaded by PowerCenter mapping m_FL_JS_STAGING_FULL."
    columns:
      - name: "order_id"
        data_type: "varchar"
      - name: "customer_id"
        data_type: "varchar"
      - name: "location_id"
        data_type: "varchar"
      - name: "ordered_at_day"
        data_type: "timestamp"
      - name: "subtotal_cents"
        data_type: "double"
      - name: "tax_paid_cents"
        data_type: "double"
      - name: "order_total_cents"
        data_type: "decimal(12,2)"
      - name: "subtotal"
        data_type: "double"
      - name: "tax_paid"
        data_type: "double"
      - name: "order_total"
        data_type: "decimal(12,2)"
  - name: "stg_order_items"
    description: "Target STG_ORDER_ITEMS loaded by PowerCenter mapping m_FL_JS_STAGING_FULL."
    columns:
      - name: "order_item_id"
        data_type: "varchar"
      - name: "order_id"
        data_type: "varchar"
      - name: "product_id"
        data_type: "varchar"
  - name: "stg_products"
    description: "Target STG_PRODUCTS loaded by PowerCenter mapping m_FL_JS_STAGING_FULL."
    columns:
      - name: "product_id"
        data_type: "varchar"
      - name: "product_name"
        data_type: "varchar"
      - name: "product_type"
        data_type: "varchar"
      - name: "product_price_cents"
        data_type: "double"
      - name: "product_price"
        data_type: "decimal(12,2)"
      - name: "product_description"
        data_type: "varchar"
      - name: "is_food_item"
        data_type: "decimal(1,0)"
      - name: "is_drink_item"
        data_type: "decimal(1,0)"
  - name: "stg_supplies"
    description: "Target STG_SUPPLIES loaded by PowerCenter mapping m_FL_JS_STAGING_FULL."
    columns:
      - name: "supply_id"
        data_type: "varchar"
      - name: "supply_name"
        data_type: "varchar"
      - name: "supply_cost_cents"
        data_type: "decimal(12,2)"
      - name: "supply_cost"
        data_type: "decimal(12,2)"
      - name: "is_perishable"
        data_type: "decimal(1,0)"
      - name: "product_id"
        data_type: "varchar"
